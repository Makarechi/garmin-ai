[package]
name = "fit-decoder-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
embedded-io-adapters = { version = "=0.7.0", features = ["std"] }
fitparser = "=0.12.0"
hex = "0.4.3"
rustyfit = { version = "=0.11.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
