openapi: 3.0.3
info:
  title: Anthropic Messages structured output subset
  version: synthetic-1
servers:
  - url: https://api.anthropic.com/v1
paths:
  /messages:
    post:
      operationId: createMessage
      responses:
        '200':
          description: Synthetic completed response
          content:
            application/json:
              example:
                id: msg_synthetic
                type: message
                role: assistant
                stop_reason: end_turn
                content:
                  - type: text
                    text: '{"urgent":false,"response_language":"en"}'
                usage:
                  input_tokens: 8
                  output_tokens: 3
        '429':
          description: Synthetic rate limit
          content:
            application/json:
              example:
                error:
                  type: rate_limit_error
                  message: Synthetic rate limit
