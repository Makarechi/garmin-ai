purpose:
  stands_in_for: OpenAI Responses endpoint with synthetic inputs and outputs.
  unblocks: Local HTTP transport and failure-path verification without an external model or account.
assumptions:
  - id: caller-outcome
    status: supported
    claim: The guarded adapter reports success for the modeled openai-responses scenario.
    reason: The application ran against a local stand-in; this does not verify the real provider.
    verification: 2026-10-29, Postman CLI 1.76.0, local one-port simulation and tests/evals/openai_simulation_probe.py; expected success observed. Success produced a POST /v1/responses request event. Injected failures do not reach the mock log. Rechecked on 2026-10-29 at commit 883ae92c00130d67cc540032d81d3294e0489b65 with Python 3.15.1; the same outcome was observed.
    source: tests/evals/openai_simulation_probe.py; postman/simulations/openai-responses.sim.yaml; postman/mocks/openai-responses/default.js
    updated_at: "2026-10-29"
  - id: live-model-compatibility
    status: unknown
    claim: A particular OpenAI model accepts all application schemas and performs the intended workflows.
    reason: The mock replays synthetic output and does not validate real model capabilities or semantics. No live calls were made.
    verification: Official Structured Outputs documentation consulted; no provider-owned mock was searched because the Postman CLI was signed out.
    source: https://developers.openai.com/api/docs/guides/structured-outputs
    updated_at: "2026-10-29"
  - id: tls-simulation
    status: unknown
    claim: This local simulation exercises the production TLS path.
    reason: Python 3.13 rejected the Postman proxy CA because its certificate lacks an Authority Key Identifier; the recorded run used one-port HTTP and a test-only URL override.
    verification: 2026-10-29 proxy test failed certificate validation before any request reached the mock; no TLS verification was disabled.
    source: tests/evals/openai_simulation_probe.py
    updated_at: "2026-10-29"
