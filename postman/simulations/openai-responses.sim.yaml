# Simulation scaffold. Add fault-injection scenarios under each mock, e.g.:
#   scenarios:
#     - overrides:
#         conditions:
#           latency: { delay_ms: 500 }
# Then serve it with: postman simulation run <this file>

simulation: openai-responses
routing: path
mocks:
  - name: openai-responses
    routeKey: openai-responses
    origin:
      - api.openai.com
    path: postman/mocks/openai-responses
