name: Rust CI
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/check_rust_boundaries.py'
      - 'src/garmin_ai/static/**'
      - 'tests/test_web_chat_browser.py'
      - 'tests/test_dashboard_demo_browser.py'
      - 'migration/check_file_json.py'
      - 'migration/check_garmin_web_reauth.py'
      - 'migration/check_cutover_restore.py'
      - 'migration/check_insights_list.py'
      - 'migration/check_legacy_telegram_schema.py'
      - 'migration/check_mcp_generic_nonfinite.py'
      - 'migration/check_native_migrate_command.py'
      - 'migration/check_native_schema.py'
      - 'migration/check_postgres_readiness.py'
      - 'migration/check_telegram_schema.py'
      - 'migration/check_transport_retention.py'
      - 'migration/check_wellbeing_observations.py'
      - 'migration/capture_reference.py'
      - 'src/garmin_ai/api.py'
      - 'src/garmin_ai/db.py'
      - 'src/garmin_ai/migrations/**'
      - 'alembic.ini'
      - '.github/workflows/rust-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/check_rust_boundaries.py'
      - 'src/garmin_ai/static/**'
      - 'tests/test_web_chat_browser.py'
      - 'tests/test_dashboard_demo_browser.py'
      - 'migration/check_file_json.py'
      - 'migration/check_garmin_web_reauth.py'
      - 'migration/check_cutover_restore.py'
      - 'migration/check_insights_list.py'
      - 'migration/check_legacy_telegram_schema.py'
      - 'migration/check_mcp_generic_nonfinite.py'
      - 'migration/check_native_migrate_command.py'
      - 'migration/check_native_schema.py'
      - 'migration/check_postgres_readiness.py'
      - 'migration/check_telegram_schema.py'
      - 'migration/check_transport_retention.py'
      - 'migration/check_wellbeing_observations.py'
      - 'migration/capture_reference.py'
      - 'src/garmin_ai/api.py'
      - 'src/garmin_ai/db.py'
      - 'src/garmin_ai/migrations/**'
      - 'alembic.ini'
      - '.github/workflows/rust-ci.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: test "$(uname -m)" = "${{ matrix.machine }}"
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - run: env -i ./target/release/garmin-ai-rust --version
      - name: Check out the frozen JSON import reference
        uses: actions/checkout@v4
        with:
          ref: ee3a14a48a6ad30c1085951bac2f53c9088c2450
          path: test-results/python-file-reference
          persist-credentials: false
      - name: Build the frozen Python image for this Linux architecture
        run: |
          reference="$GITHUB_WORKSPACE/test-results/python-file-reference"
          test "$(git -C "$reference" rev-parse HEAD)" = ee3a14a48a6ad30c1085951bac2f53c9088c2450
          docker build --tag garmin-ai-file-reference "$reference"
      - name: Compare JSON import with the reference on this Linux architecture
        run: |
          fixtures=$(mktemp -d)
          docker run --rm --network none --user "$(id -u):$(id -g)" --ulimit stack=8388608:8388608 \
            --volume "$GITHUB_WORKSPACE/migration/check_file_json.py:/capture.py:ro" \
            --volume "$fixtures:/fixtures" garmin-ai-file-reference python /capture.py /fixtures --properties
          GA_TEST_FILE_JSON="$fixtures" cargo test --locked -p ga-domain --test file_json -- --ignored
      - name: Record crate and license inventory
        run: cargo metadata --locked --format-version 1 > rust-package-inventory.json
      - name: Verify Rust dependency boundaries
        run: python3 scripts/check_rust_boundaries.py < rust-package-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-package-inventory-${{ matrix.machine }}
          path: rust-package-inventory.json

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit --file Cargo.lock

  postgres-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17@sha256:bc8527e62f70f0766b29515077965025872fabb5349db421565f69ee273baf2d
        env:
          POSTGRES_USER: garmin
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: garmin_ai_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U garmin -d garmin_ai_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GA_TEST_DATABASE_URL: postgresql+psycopg://garmin:test-only-password@localhost:5432/garmin_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked
      - run: cargo build --locked --release -p ga-app
      - run: uv run python migration/check_postgres_readiness.py target/release/garmin-ai-rust --bootstrap
      - run: cargo test --locked -p ga-db --test job_leases -- --ignored
      - run: cargo test --locked -p ga-db --test garmin_owner -- --ignored
      - run: cargo test --locked -p ga-db --test raw_capture -- --ignored
      - name: Keep the worker running through an archive query timeout
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U garmin replay_worker_test
          export GA_TEST_DATABASE_URL="${GA_TEST_DATABASE_URL%/*}/replay_worker_test"
          GA_DATABASE_URL="$GA_TEST_DATABASE_URL" target/release/garmin-ai-rust migrate
          cargo test --locked -p ga-app --test replay_worker -- --ignored
      - name: Answer Telegram capability questions locally
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U garmin telegram_help_test
          export GA_TEST_DATABASE_URL="${GA_TEST_DATABASE_URL%/*}/telegram_help_test"
          GA_DATABASE_URL="$GA_TEST_DATABASE_URL" target/release/garmin-ai-rust migrate
          cargo test --locked -p ga-app --test telegram_local_text capability_questions -- --ignored
      - name: Verify the public migration command for every supported schema
        run: |
          binary=target/release/garmin-ai-rust
          prefix=schema_cli
          databases=$(uv run python migration/check_native_migrate_command.py "$binary" "$prefix" --list-databases)
          while IFS= read -r database; do
            docker exec "${{ job.services.postgres.id }}" createdb -U garmin "$database"
          done <<< "$databases"
          uv run python migration/check_native_migrate_command.py "$binary" "$prefix"
      - name: Compare legacy nonfinite numbers over MCP
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U garmin garmin_mcp_nonfinite_test
          GA_TEST_DATABASE_URL="${GA_TEST_DATABASE_URL%/*}/garmin_mcp_nonfinite_test" \
            uv run python migration/check_mcp_generic_nonfinite.py target/release/garmin-ai-rust
      - name: Check out the frozen Garmin reauthentication reference
        uses: actions/checkout@v4
        with:
          ref: ee3a14a48a6ad30c1085951bac2f53c9088c2450
          path: test-results/python-reauth-reference
          persist-credentials: false
      - name: Compare signed Garmin reauthentication requests
        run: |
          reference="$GITHUB_WORKSPACE/test-results/python-reauth-reference"
          test "$(git -C "$reference" rev-parse HEAD)" = ee3a14a48a6ad30c1085951bac2f53c9088c2450
          uv sync --project "$reference" --locked --no-dev --extra garmin
          docker exec "${{ job.services.postgres.id }}" createdb -U garmin garmin_reauth_test
          cd "$reference"
          GA_TEST_DATABASE_URL="${GA_TEST_DATABASE_URL%/*}/garmin_reauth_test" \
            "$reference/.venv/bin/python" "$GITHUB_WORKSPACE/migration/check_garmin_web_reauth.py" \
            "$GITHUB_WORKSPACE/target/release/garmin-ai-rust"
      - name: Rehearse read-only inspection and recovery before and after writes
        run: |
          for phase in source before after; do
            docker exec "${{ job.services.postgres.id }}" createdb -U garmin "cutover_${phase}_test"
          done
          database_url_prefix="${GA_TEST_DATABASE_URL%/*}"
          GA_TEST_DATABASE_URL="$database_url_prefix/cutover_source_test" \
            GA_TEST_BEFORE_RESTORE_URL="$database_url_prefix/cutover_before_test" \
            GA_TEST_AFTER_RESTORE_URL="$database_url_prefix/cutover_after_test" \
            uv run python migration/check_cutover_restore.py target/release/garmin-ai-rust
      - name: Compare paginated reads over HTTP and MCP
        run: |
          for tool in insights_list wellbeing_observations; do
            database="garmin_${tool}_test"
            docker exec "${{ job.services.postgres.id }}" createdb -U garmin "$database"
            GA_TEST_DATABASE_URL="${GA_TEST_DATABASE_URL%/*}/$database" \
              uv run python "migration/check_${tool}.py" target/release/garmin-ai-rust
          done
      - name: Compare retention review, resume and apply with Python
        run: |
          for side in python native; do
            docker exec "${{ job.services.postgres.id }}" createdb -U garmin "retention_${side}_test"
          done
          database_url_prefix="${GA_TEST_DATABASE_URL%/*}"
          GA_TEST_DATABASE_URL="$database_url_prefix/retention_python_test" \
            GA_TEST_NATIVE_URL="$database_url_prefix/retention_native_test" \
            uv run python migration/check_transport_retention.py target/release/garmin-ai-rust
      - name: Exercise the Rust HTTP server and demo in Chromium
        env:
          GA_REQUIRE_TEST_DB: "1"
          GA_TEST_NATIVE_WEB: target/release/garmin-ai-rust
          GA_TEST_NATIVE_DEMO: target/release/garmin-ai-rust
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest -q -ra --junitxml=native-browser.xml \
            tests/test_web_chat_browser.py tests/test_dashboard_demo_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-browser-results
          path: native-browser.xml
          if-no-files-found: warn
