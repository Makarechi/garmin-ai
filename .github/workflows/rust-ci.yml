name: Rust CI
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/check_rust_boundaries.py'
      - '.github/workflows/rust-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/check_rust_boundaries.py'
      - '.github/workflows/rust-ci.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: test "$(uname -m)" = "${{ matrix.machine }}"
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - run: env -i ./target/release/garmin-ai-rust --version
      - name: Record crate and license inventory
        run: cargo metadata --locked --format-version 1 > rust-package-inventory.json
      - name: Verify Rust dependency boundaries
        run: python3 scripts/check_rust_boundaries.py < rust-package-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-package-inventory-${{ matrix.machine }}
          path: rust-package-inventory.json

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit --file Cargo.lock
