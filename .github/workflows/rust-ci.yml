name: Rust CI
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/check_rust_boundaries.py'
      - 'migration/check_postgres_readiness.py'
      - 'migration/capture_reference.py'
      - 'src/garmin_ai/api.py'
      - 'src/garmin_ai/db.py'
      - 'src/garmin_ai/migrations/**'
      - 'alembic.ini'
      - '.github/workflows/rust-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/check_rust_boundaries.py'
      - 'migration/check_postgres_readiness.py'
      - 'migration/capture_reference.py'
      - 'src/garmin_ai/api.py'
      - 'src/garmin_ai/db.py'
      - 'src/garmin_ai/migrations/**'
      - 'alembic.ini'
      - '.github/workflows/rust-ci.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: test "$(uname -m)" = "${{ matrix.machine }}"
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - run: env -i ./target/release/garmin-ai-rust --version
      - name: Record crate and license inventory
        run: cargo metadata --locked --format-version 1 > rust-package-inventory.json
      - name: Verify Rust dependency boundaries
        run: python3 scripts/check_rust_boundaries.py < rust-package-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-package-inventory-${{ matrix.machine }}
          path: rust-package-inventory.json

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit --file Cargo.lock

  postgres-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17@sha256:bc8527e62f70f0766b29515077965025872fabb5349db421565f69ee273baf2d
        env:
          POSTGRES_USER: garmin
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: garmin_ai_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U garmin -d garmin_ai_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GA_TEST_DATABASE_URL: postgresql+psycopg://garmin:test-only-password@localhost:5432/garmin_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked
      - run: cargo build --locked --release -p ga-app
      - run: uv run python migration/check_postgres_readiness.py target/release/garmin-ai-rust --bootstrap
