name: Rust CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: test "$(uname -m)" = "${{ matrix.machine }}"
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - run: env -i ./target/release/garmin-ai-rust --version
      - name: Record crate and license inventory
        run: cargo metadata --locked --format-version 1 > rust-package-inventory.json
      - name: Verify Rust dependency boundaries
        run: python3 scripts/check_rust_boundaries.py < rust-package-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-package-inventory-${{ matrix.machine }}
          path: rust-package-inventory.json

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit --file Cargo.lock

  postgres-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17@sha256:bc8527e62f70f0766b29515077965025872fabb5349db421565f69ee273baf2d
        env:
          POSTGRES_USER: garmin
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: garmin_ai_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U garmin -d garmin_ai_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GA_TEST_DATABASE_URL: postgresql+psycopg://garmin:test-only-password@localhost:5432/garmin_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked
      - run: uv run --locked ruff check scripts tests migration/check_postgres_readiness.py
      - run: uv run --locked ruff format --check scripts tests migration/check_postgres_readiness.py
      - run: cargo build --locked --release -p ga-app
      - run: uv run python migration/check_postgres_readiness.py target/release/garmin-ai-rust --bootstrap
      - run: cargo test --locked -p ga-db --test job_leases -- --ignored
      - run: cargo test --locked -p ga-db --test garmin_owner -- --ignored
      - run: cargo test --locked -p ga-db --test raw_capture -- --ignored
      - name: Keep the worker running through an archive query timeout
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U garmin replay_worker_test
          export GA_TEST_DATABASE_URL="${GA_TEST_DATABASE_URL%/*}/replay_worker_test"
          GA_DATABASE_URL="$GA_TEST_DATABASE_URL" target/release/garmin-ai-rust migrate
          cargo test --locked -p ga-app --test replay_worker -- --ignored
      - name: Answer Telegram capability questions in the user's language
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U garmin telegram_help_test
          export GA_TEST_DATABASE_URL="${GA_TEST_DATABASE_URL%/*}/telegram_help_test"
          GA_DATABASE_URL="$GA_TEST_DATABASE_URL" target/release/garmin-ai-rust migrate
          cargo test --locked -p ga-app --lib publishes_multilingual_capability_answers_with_one_model_call -- --ignored
      - name: Exercise the Rust HTTP server and demo in Chromium
        env:
          GA_TEST_NATIVE_WEB: target/release/garmin-ai-rust
          GA_TEST_NATIVE_DEMO: target/release/garmin-ai-rust
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest -q -ra --junitxml=native-browser.xml \
            tests/test_web_chat_browser.py tests/test_dashboard_demo_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-browser-results
          path: native-browser.xml
          if-no-files-found: warn
