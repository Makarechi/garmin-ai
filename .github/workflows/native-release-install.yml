name: Native release installation

on:
  workflow_dispatch:
    inputs:
      app_image:
        description: Optional digest-pinned native image matching the selected Git revision
        type: string
        required: false
  pull_request:
    paths:
      - ".github/workflows/native-release-install.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yml"
      - "compose.gcp.yml"
      - "deploy/gcp/**"
      - "install.sh"
      - "Cargo.lock"
      - "crates/ga-app/Cargo.toml"
      - "crates/ga-db/schema-revision.txt"
      - "tests/test_release_bundle.py"
      - "tests/test_rust_notices.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/build_release_bundle.py"
      - "scripts/collect_rust_notices.py"
      - "scripts/rust-license-notices/**"
      - "scripts/smoke_release_install.sh"
      - "scripts/verify_release_install.py"
      - "crates/ga-app/src/setup.rs"
      - "crates/ga-app/src/setup/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-release-install.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yml"
      - "compose.gcp.yml"
      - "deploy/gcp/**"
      - "install.sh"
      - "Cargo.lock"
      - "crates/ga-app/Cargo.toml"
      - "crates/ga-db/schema-revision.txt"
      - "tests/test_release_bundle.py"
      - "tests/test_rust_notices.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/build_release_bundle.py"
      - "scripts/collect_rust_notices.py"
      - "scripts/rust-license-notices/**"
      - "scripts/smoke_release_install.sh"
      - "scripts/verify_release_install.py"
      - "crates/ga-app/src/setup.rs"
      - "crates/ga-app/src/setup/**"

permissions:
  contents: read

jobs:
  install:
    name: Native bundle (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      GA_SMOKE_NATIVE_IMAGE: ${{ inputs.app_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked
      - name: Check packaging and installer rules
        run: uv run --locked pytest -q tests/test_release_bundle.py tests/test_rust_notices.py
      - name: Install and restart a source-free native bundle
        run: bash scripts/smoke_release_install.sh
      - name: Check out the frozen historical schema fixture
        uses: actions/checkout@v4
        with:
          ref: 9376d081620740799362282ac9faf2f1a1baaffa
          path: test-results/historical-schema
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: test-results/historical-schema/.python-version
      - run: uv sync --project test-results/historical-schema --locked --no-dev
      - name: Upgrade a historical installation with the native bundle
        env:
          GA_SMOKE_HISTORICAL: "true"
          GA_SMOKE_LEGACY_REFERENCE: test-results/historical-schema
        run: bash scripts/smoke_release_install.sh
      - name: Install the GCP profile from a source-free native bundle
        if: matrix.architecture == 'amd64'
        env:
          GA_SMOKE_GCP: "true"
        run: bash scripts/smoke_release_install.sh
      - name: Preserve non-sensitive platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rust-install-${{ matrix.architecture }}
          path: |
            test-results/native-rust-install.json
            test-results/native-rust-upgrade.json
            test-results/native-rust-gcp-install.json
            test-results/native-licenses-*.zip
          if-no-files-found: warn
