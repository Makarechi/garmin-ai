name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17@sha256:bc8527e62f70f0766b29515077965025872fabb5349db421565f69ee273baf2d
        env:
          POSTGRES_USER: garmin
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: garmin_ai_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U garmin -d garmin_ai_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GA_REQUIRE_TEST_DB: "1"
      GA_TEST_DATABASE_URL: postgresql+psycopg://garmin:test-only-password@localhost:5432/garmin_ai_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -ra --junitxml=test-results/pytest.xml
      - name: Preserve test outcomes and skip reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: warn
      - run: git diff --check HEAD^1 HEAD
