name: Native off-host recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-offhost-restore.yml"
      - "scripts/extract_native_test_binary.sh"
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.lock"
      - "crates/ga-db/schema-revision.txt"
      - "crates/ga-app/src/backup.rs"
      - "crates/ga-archive/src/backup*"
      - "crates/ga-archive/src/backup*/**"
      - "crates/ga-db/src/database_export.rs"
      - "crates/ga-db/src/database_restore.rs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-offhost-restore.yml"
      - "scripts/extract_native_test_binary.sh"
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.lock"
      - "crates/ga-db/schema-revision.txt"
      - "crates/ga-app/src/backup.rs"
      - "crates/ga-archive/src/backup*"
      - "crates/ga-archive/src/backup*/**"
      - "crates/ga-db/src/database_export.rs"
      - "crates/ga-db/src/database_restore.rs"

permissions:
  contents: read

env:
  FROZEN_PYTHON_COMMIT: 9376d081620740799362282ac9faf2f1a1baaffa

jobs:
  capture:
    name: Off-host backup (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        runtime: [python, rust]
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17@sha256:bc8527e62f70f0766b29515077965025872fabb5349db421565f69ee273baf2d
        env:
          POSTGRES_USER: garmin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: garmin_native_offhost_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U garmin -d garmin_native_offhost_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GA_TEST_DATABASE_URL: postgresql+psycopg://garmin@127.0.0.1:5432/garmin_native_offhost_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_PYTHON_COMMIT }}
          path: test-results/backup-fixture
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: test-results/backup-fixture/.python-version
      - if: matrix.runtime == 'rust'
        run: bash scripts/extract_native_test_binary.sh "$RUNNER_TEMP/garmin-ai-rust"
      - name: Create encrypted synthetic backup
        env:
          PROBE_RUNTIME: ${{ matrix.runtime }}
        run: |
          project="$GITHUB_WORKSPACE/test-results/backup-fixture"
          test "$(git -C "$project" rev-parse HEAD)" = "$FROZEN_PYTHON_COMMIT"
          if [[ $PROBE_RUNTIME == rust ]]; then
            args=(--native-binary "$RUNNER_TEMP/garmin-ai-rust")
          else
            args=(--python-reference "$FROZEN_PYTHON_COMMIT")
          fi
          PYTHONPATH="$project/src:$project/migration" uv run --locked --no-dev --project "$project" \
            python "$project/tests/evals/offhost_restore_probe.py" create \
            "$RUNNER_TEMP/synthetic-offhost" --commit "$GITHUB_SHA" "${args[@]}"
      # The short-lived key and archive contain only data generated in this job.
      - uses: actions/upload-artifact@v4
        with:
          name: native-offhost-fixture-${{ matrix.runtime }}
          path: ${{ runner.temp }}/synthetic-offhost/synthetic-*
          retention-days: 1
          if-no-files-found: error

  recover:
    name: Off-host recovery (${{ matrix.source }} to Rust)
    needs: capture
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        source: [python, rust]
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17@sha256:bc8527e62f70f0766b29515077965025872fabb5349db421565f69ee273baf2d
        env:
          POSTGRES_USER: garmin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: garmin_native_offhost_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U garmin -d garmin_native_offhost_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GA_TEST_DATABASE_URL: postgresql+psycopg://garmin@127.0.0.1:5432/garmin_native_offhost_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_PYTHON_COMMIT }}
          path: test-results/backup-fixture
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: test-results/backup-fixture/.python-version
      - run: bash scripts/extract_native_test_binary.sh "$RUNNER_TEMP/garmin-ai-rust"
      - uses: actions/download-artifact@v4
        with:
          name: native-offhost-fixture-${{ matrix.source }}
          path: ${{ runner.temp }}/synthetic-offhost
      - name: Restore and verify with Rust on a separate host
        run: |
          project="$GITHUB_WORKSPACE/test-results/backup-fixture"
          test "$(git -C "$project" rev-parse HEAD)" = "$FROZEN_PYTHON_COMMIT"
          PYTHONPATH="$project/src:$project/migration" uv run --locked --no-dev --project "$project" \
            python "$project/tests/evals/offhost_restore_probe.py" restore \
            "$RUNNER_TEMP/synthetic-offhost" --work "$RUNNER_TEMP/synthetic-restored" \
            --native-binary "$RUNNER_TEMP/garmin-ai-rust" \
            --commit "$GITHUB_SHA" --evidence "$RUNNER_TEMP/native-offhost-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-offhost-result-${{ matrix.source }}-to-rust
          path: ${{ runner.temp }}/native-offhost-result.json
          if-no-files-found: error
