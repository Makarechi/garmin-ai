name: Bug report
description: Report a reproducible problem using synthetic or redacted details.
body:
  - type: markdown
    attributes:
      value: "Do not attach tokens, health exports, FIT files, voice, backups, or private logs. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include steps and invented data only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already run
