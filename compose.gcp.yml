# Resource limits and optional Garmin sign-in gateway for the native GCP bundle.
services:
  db:
    mem_limit: 320m
    memswap_limit: 768m
    environment:
      NO_TS_TUNE: 'true'
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - timescaledb.max_background_workers=4
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  migrate:
    mem_limit: 256m
    logging: *bounded_logs
  api:
    mem_limit: 192m
    memswap_limit: 384m
    healthcheck:
      start_period: 300s
      timeout: 30s
    logging: *bounded_logs
  worker:
    mem_limit: 384m
    memswap_limit: 1024m
    healthcheck:
      start_period: 300s
      timeout: 30s
    logging: *bounded_logs
  auth-gateway:
    profiles: [garmin-web-auth]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GA_GARMIN_AUTH_HOST: ${GA_GARMIN_AUTH_HOST:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/gcp/Caddyfile.garmin-auth:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *bounded_logs
volumes:
  caddy-data:
  caddy-config:
