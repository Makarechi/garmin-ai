[package]
name = "ga-garmin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
ga-archive = { path = "../ga-archive" }
ga-domain = { path = "../ga-domain" }
httpdate = "1.0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "form", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.54.1", features = ["io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt"] }

[lints]
workspace = true
