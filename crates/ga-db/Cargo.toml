[package]
name = "ga-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ga-archive = { path = "../ga-archive" }
ga-domain = { path = "../ga-domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["time", "uuid"] }
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "time"] }
uuid = { version = "1.29.3", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt"] }
