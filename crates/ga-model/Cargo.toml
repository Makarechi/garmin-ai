[package]
name = "ga-model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ga-domain = { path = "../ga-domain" }
httpdate = "1.0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true
