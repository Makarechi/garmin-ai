[package]
name = "ga-archive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
ga-domain = { path = "../ga-domain" }
getrandom = "0.4.3"
hex = "0.4.3"
openssl = { version = "0.10.82", features = ["vendored"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
sha2 = { version = "0.11.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"

[lints]
workspace = true
