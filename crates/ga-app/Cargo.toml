[package]
name = "ga-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "garmin-ai-rust"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15.7"
ga-db = { path = "../ga-db" }
ga-domain = { path = "../ga-domain" }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
speedate = "=0.17.0"
subtle = { version = "2.6.1", default-features = false }
uuid = { version = "1.29.3", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "signal"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
