[package]
name = "ga-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "garmin-ai-rust"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15.7"
fancy-regex = { version = "=0.20.2", default-features = false, features = ["std", "unicode"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
form_urlencoded = "1.2"
ga-archive = { path = "../ga-archive" }
ga-db = { path = "../ga-db" }
ga-domain = { path = "../ga-domain" }
ga-fit = { path = "../ga-fit" }
ga-garmin = { path = "../ga-garmin" }
ga-model = { path = "../ga-model" }
hmac = { version = "0.13.0", default-features = false, features = ["zeroize"] }
zeroize = "1.9"
markdown-it-rust-core = "=4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.11.1", default-features = false }
speedate = "=0.17.0"
subtle = { version = "2.6.1", default-features = false }
uuid = { version = "1.29.3", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-io"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tempfile = "3.27.0"
