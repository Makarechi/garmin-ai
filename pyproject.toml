[project]
name = "garmin-ai"
version = "0.1.0"
description = "Local-first Garmin health timeline and personal analytics"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "anyio>=4,<5",
    "cryptography>=45,<47",
    "fastapi>=0.116,<1",
    "fitdecode>=0.11,<1",
    "garminconnect @ git+https://github.com/cyberjunky/python-garminconnect@5511c729b4f92713c6b6bfdd5f8d1ebb4363f4cd",
    "google-genai>=2.3,<3",
    "httpx>=0.28,<1",
    "mcp>=1.12,<2",
    "numpy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-telegram-bot>=22,<23",
    "scipy>=1.16,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
garmin-ai = "garmin_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/garmin_ai/api.py" = ["B008"]

[tool.hatch.metadata]
allow-direct-references = true
