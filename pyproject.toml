[project]
name = "garmin-ai-dev-tools"
version = "0.0.0"
description = "Tooling for testing the Rust application"
requires-python = ">=3.13,<3.16"
dependencies = [
    "httpx>=0.28,<1",
    "playwright>=1.63,<2",
    "psycopg[binary]>=3.2,<4",
    "pytest>=8,<10",
    "python-dotenv>=1,<2",
    "ruff>=0.12,<1",
    "sqlalchemy>=2,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
