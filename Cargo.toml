[workspace]
members = ["crates/ga-app", "crates/ga-archive", "crates/ga-db", "crates/ga-domain", "crates/ga-garmin"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
