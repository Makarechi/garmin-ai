[project]
name = "garmin-ai-synthetic-model-fixture"
version = "0.0.1"
requires-python = ">=3.13,<3.15"
dependencies = ["garmin-ai"]

[project.entry-points."garmin_ai.integrations"]
"model.synthetic" = "synthetic_model:descriptor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthetic_model"]
