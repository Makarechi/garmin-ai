[project]
name = "garmin-ai-synthetic-adapters-fixture"
version = "0.0.1"
requires-python = ">=3.13,<3.15"
dependencies = ["garmin-ai"]

[project.entry-points."garmin_ai.integrations"]
"source.sample" = "synthetic_adapters:source_descriptor"
"channel.sample" = "synthetic_adapters:channel_descriptor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthetic_adapters"]
